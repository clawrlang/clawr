name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    # The runtime builds a macOS dylib (clang -dynamiclib, otool) and rwrc is
    # codesigned, so the full suite only runs on macOS.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and e2e tests
        run: npm test

      - name: Runtime tests
        run: npm run test:runtime

      - name: VS Code extension tests
        run: npm run test:vscode
